<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051020"/>
      <stop offset="50%" stop-color="#0a1e3a"/>
      <stop offset="100%" stop-color="#040c18"/>
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Saffron Gradient -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#D95300"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Base: Squircle with Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="105" ry="105" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="28" y="28" width="456" height="456" rx="95" ry="95" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Parliament Dome Silhouette Arc in Gold -->
  <g opacity="0.35" transform="translate(0, -15)">
    <path d="M 156 180 A 100 45 0 0 1 356 180" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <path d="M 176 180 A 80 35 0 0 1 336 180" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Pillars -->
    <line x1="180" y1="180" x2="180" y2="205" stroke="url(#goldGrad)" stroke-width="3"/>
    <line x1="205" y1="172" x2="205" y2="205" stroke="url(#goldGrad)" stroke-width="3"/>
    <line x1="230" y1="168" x2="230" y2="205" stroke="url(#goldGrad)" stroke-width="3"/>
    <line x1="256" y1="166" x2="256" y2="205" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <line x1="282" y1="168" x2="282" y2="205" stroke="url(#goldGrad)" stroke-width="3"/>
    <line x1="307" y1="172" x2="307" y2="205" stroke="url(#goldGrad)" stroke-width="3"/>
    <line x1="332" y1="180" x2="332" y2="205" stroke="url(#goldGrad)" stroke-width="3"/>
  </g>

  <!-- Central Ashoka Chakra Motif -->
  <g transform="translate(256, 260)" opacity="0.45">
    <circle cx="0" cy="0" r="115" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="url(#goldGrad)"/>
    <!-- 24 Spokes -->
    <g stroke="url(#goldGrad)" stroke-width="2">
      <line x1="0" y1="-22" x2="0" y2="-115"/>
      <line x1="0" y1="22" x2="0" y2="115"/>
      <line x1="-22" y1="0" x2="-115" y2="0"/>
      <line x1="22" y1="0" x2="115" y2="0"/>
      <line x1="-15.5" y1="-15.5" x2="-81.3" y2="-81.3"/>
      <line x1="15.5" y1="-15.5" x2="81.3" y2="-81.3"/>
      <line x1="-15.5" y1="15.5" x2="-81.3" y2="81.3"/>
      <line x1="15.5" y1="15.5" x2="81.3" y2="81.3"/>
      <line x1="-8.4" y1="-20.3" x2="-44" y2="-106.2"/>
      <line x1="8.4" y1="-20.3" x2="44" y2="-106.2"/>
      <line x1="-8.4" y1="20.3" x2="-44" y2="106.2"/>
      <line x1="8.4" y1="20.3" x2="44" y2="106.2"/>
      <line x1="-20.3" y1="-8.4" x2="-106.2" y2="-44"/>
      <line x1="20.3" y1="-8.4" x2="106.2" y2="-44"/>
      <line x1="-20.3" y1="8.4" x2="-106.2" y2="44"/>
      <line x1="20.3" y1="8.4" x2="106.2" y2="44"/>
    </g>
  </g>

  <!-- Main Logo Typography: Capital 'R' + Hindi 'ाजनीति' -->
  <g filter="url(#shadow)">
    <!-- Capital English 'R' in Regal Gold & Saffron -->
    <text x="75" y="325" font-family="'Cinzel', 'Times New Roman', serif" font-size="160" font-weight="900" fill="url(#goldGrad)" stroke="#78350F" stroke-width="2.5" letter-spacing="-2">
      R
    </text>

    <!-- Hindi 'ाजनीति' in Devanagari Script -->
    <text x="180" y="325" font-family="'Yatra One', 'Rozha One', 'Tiro Devanagari Hindi', serif" font-size="138" font-weight="900" fill="url(#goldGrad)" stroke="#78350F" stroke-width="2">
      ाजनीति
    </text>
  </g>

  <!-- Elegant Tricolor Accent Bar Below Typography -->
  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="100" height="5" rx="2.5" fill="#FF9933"/>
    <rect x="106" y="0" width="100" height="5" rx="2.5" fill="#FFFFFF"/>
    <rect x="212" y="0" width="100" height="5" rx="2.5" fill="#138808"/>
  </g>

  <!-- Subtitle Tagline in Clean Typography -->
  <text x="256" y="405" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#FDE68A" letter-spacing="4" text-anchor="middle" opacity="0.9">
    एक आम आदमी से प्रधानमंत्री तक
  </text>
</svg>