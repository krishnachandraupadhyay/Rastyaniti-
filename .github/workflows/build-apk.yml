name: Build Android APK (राष्ट्रनीति)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate APK in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web Game
        run: |
          npm install
          npm run build
          mkdir -p app/src/main/assets/web
          cp -r dist/* app/src/main/assets/web/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle_build.log

      - name: Prepare APK for Distribution
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release-apk/RashtraNiti-v1.0.0.apk \;
          ls -la release-apk/

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RashtraNiti-Android-App-APK
          path: release-apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-app
          name: "राष्ट्रनीति (RashtraNiti) v1.0.0 - Android APK"
          files: release-apk/*.apk
          body: |
            ### 🇮🇳 राष्ट्रनीति (RashtraNiti) Android App (v1.0.0)

            **सीधे अपने Android फ़ोन में डाउनलोड कर खेलें:**
            - **APK फ़ाइल:** `RashtraNiti-v1.0.0.apk`
            - **आधिकारिक लोगो:** RASHTRA तंत्र (अखंड भारत मानचित्र, अशोक चक्र व मशाल)
            
            #### मुख्य विशेषताएं:
            1. **10-मोड डायनेमिक बैकग्राउंड एनीमेशन** (60 FPS Android Optimized)
            2. **7-दिवसीय चुनाव अभियान वॉर रूम** व मतदाता जोखिम इंजन
            3. **65+ प्रामाणिक संविधान व नागरिक शास्त्र क्विज़ प्रश्न**
            4. **स्क्रोल करने योग्य बॉटम नेविगेशन** व बड़े, स्पष्ट फ़ॉन्ट व आइकन्स
            5. **ऑफ़लाइन रेडी:** बिना इंटरनेट के भी पूरा गेम डिवाइस पर सुचारू चलता है
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
