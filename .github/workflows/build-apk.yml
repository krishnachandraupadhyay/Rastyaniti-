name: Build Android APK (राष्ट्रनीति)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle_build.log || {
            ERR_MSG=$(grep -i -E "(error:|what went wrong:|failure:)" -A 4 gradle_build.log | tr '\n' ' ' | head -c 250)
            echo "::error title=Gradle Build Error::$ERR_MSG"
            tail -n 60 gradle_build.log
            exit 1
          }

      - name: List Generated APK Files
        run: find . -name "*.apk" -ls

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: RashtraNiti-Android-App-APK
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 30
