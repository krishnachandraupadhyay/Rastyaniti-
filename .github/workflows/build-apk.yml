name: Build Android APK (राष्ट्रनीति)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate APK in Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle_build.log

      - name: Upload Generated APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RashtraNiti-Android-App-APK
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 30

      - name: Push Log to Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git branch -D build-logs || true
          git checkout -b build-logs
          git add gradle_build.log
          git commit -m "Debug gradle build log"
          git push -f origin build-logs
